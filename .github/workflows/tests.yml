# SPDX-License-Identifier: GPL-3.0-only
name: Unit tests (source review)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install image processing dependency
        run: python -m pip install -r requirements.txt
      - name: Run image engine tests
        run: python -m unittest discover -s tests -q
# Note: This workflow has not run on GitHub; actions must be pinned by SHA
# and the full binary build/release workflow audited before SignPath application.
