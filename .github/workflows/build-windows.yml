name: Windows build (private review)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run regression tests
        run: python -m unittest discover -s tests -q

      - name: Generate installer branding
        run: python installer/shared/make_wizard_assets.py --config installer/product.json --output installer/branding

      - name: Build the Windows application
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name SoftRyva-ImageFlow
          --icon assets/ImageFlow.ico
          --add-data "assets;assets"
          --add-data "LICENSE;."
          --add-data "THIRD_PARTY_NOTICES.md;."
          --collect-all tkinterdnd2
          imageflow.py

      - name: Check application executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/SoftRyva-ImageFlow.exe')) {
            throw 'Application EXE was not created.'
          }

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw 'Inno Setup 6 compiler (ISCC.exe) not found.' }
          & $iscc 'installer/SoftRyva_ImageFlow.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed (exit code $LASTEXITCODE)." }
          if (-not (Test-Path 'dist_setup/SoftRyva_ImageFlow_Setup_v0.3.1.exe')) {
            throw 'Expected Setup EXE was not created.'
          }

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $file = 'dist_setup/SoftRyva_ImageFlow_Setup_v0.3.1.exe'
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SoftRyva_ImageFlow_Setup_v0.3.1.exe" |
            Set-Content -Path 'dist_setup/SHA256.txt' -Encoding ascii

      - name: Upload private unsigned build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoftRyva-ImageFlow-v0.3.1-unsigned-windows
          path: |
            dist/SoftRyva-ImageFlow.exe
            dist_setup/SoftRyva_ImageFlow_Setup_v0.3.1.exe
            dist_setup/SHA256.txt
          if-no-files-found: error
          retention-days: 7
